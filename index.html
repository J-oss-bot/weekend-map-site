function getColor(minutes) {

    if (
        minutes === null
        || minutes === undefined
    ) {
        return "#777777";
    }

    if (minutes <= 20) {
        return "#35a853";
    }

    if (minutes <= 30) {
        return "#1677ff";
    }

    if (minutes <= 60) {
        return "#e5a41a";
    }

    return "#d64545";
}


function getAqiClass(aqi) {

    if (
        aqi === null
        || aqi === undefined

        return "";
    }

    if (aqi <= 50) {
        return "aqi-good";
    }

    if (aqi <= 100) {
        return "aqi-moderate";
    }

    if (aqi <= 150) {
        return "aqi-unhealthy";
    }

    if (aqi <= 200) {
        return "aqi-bad";
    }

    return "aqi-severe";
}

                    + '<div class="info-row">'
                    + 'PM2.5：'
                    + pm25Text
                    + '</div>'
                    + '<div class="weather-time">'
                    + '实时数据：'
                    + item.weather_time
                    + '</div>'
                    + '</div>'
                    + '<a class="baidu-btn" '
                    + 'href="'
                    + baiduUrl
                    + '" target="_blank" '
                    + 'rel="noopener">'
                    + '打开百度地图路线'
                    + '</a>'
                    + '</div>';

                infoWindow.setContent(content);

                infoWindow.open(
                    map,
                    marker.getPosition()
                );

            }
        );


        map.add(marker);
        markers.push(marker);

    }
);


if (markers.length > 0) {

    map.setFitView(
        [
            homeMarker,
            ...markers
        ],
        false,
        [
            60,
            60,
            60,
            60
        ]
    );

}

</script>

</body>
</html>

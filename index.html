function text(v,fallback="暂无"){return(v===null||v===undefined||v==="")?fallback:v}
function weatherHtml(x){const temp=x.temperature==null?"暂无":x.temperature+"℃";const wind=x.wind_scale==null?"暂无":text(x.wind_direction,"")+" "+x.wind_scale+"级";const aqi=x.aqi==null?"AQI 暂无":"AQI "+x.aqi+" "+text(x.aqi_level,"");const pm=x.pm25==null?"暂无":x.pm25+" μg/m³";return '<div class="weather-box"><div class="info-row">🌤 '+text(x.weather)+"　"+temp+'</div><div class="info-row">💨 '+wind+'</div><div class="info-row '+getAqiClass(x.aqi)+'">🌫 '+aqi+'</div><div class="info-row">PM2.5：'+pm+'</div><div class="weather-time">实时数据：'+text(x.weather_time)+'</div></div>'}
function openBaidu(appUrl,webUrl){let hidden=false;document.addEventListener("visibilitychange",()=>{if(document.hidden)hidden=true},{once:true});window.location.href=appUrl;setTimeout(()=>{if(!hidden)window.location.href=webUrl},1500)}
const info=new AMap.InfoWindow({offset:new AMap.Pixel(0,-20)});
const markers=[];
destinations.forEach(item=>{if(item.lng==null||item.lat==null)return;const low=item.wind_scale!=null&&item.wind_scale<=2;const cls=low?"destination-marker low-wind-marker":"destination-marker";const label=item.minutes==null?"暂无":item.minutes+" min";const marker=new AMap.Marker({position:[item.lng,item.lat],content:'<div class="'+cls+'" style="background:'+getColor(item.minutes)+'">'+label+'</div>',offset:new AMap.Pixel(-22,-15),zIndex:low?150:100});marker.on("click",()=>{const drive=item.minutes==null?"暂无":item.minutes+" 分钟";const dist=item.distance_km==null?"暂无":item.distance_km+" km";const app=JSON.stringify(item.baidu_app_url);const web=JSON.stringify(item.baidu_web_url);const content='<div class="info"><div class="info-title">'+text(item.name)+'</div><div class="info-row">📍 '+text(item.poi_address,item.poi_name)+'</div><div class="info-row">🚗 固定出发地车程：'+drive+'</div><div class="info-row">📏 距离：'+dist+'</div>'+weatherHtml(item)+'<button type="button" class="baidu-btn" onclick=\'openBaidu('+app+','+web+')\'>🚗 从当前位置打开百度地图 App</button></div>';info.setContent(content);info.open(map,marker.getPosition())});map.add(marker);markers.push(marker)});
if(markers.length)map.setFitView(markers,false,[60,60,60,60]);
</script></body></html>

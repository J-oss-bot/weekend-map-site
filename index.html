function getColor(m){if(m==null)return"#777";if(m<=20)return"#35a853";if(m<=30)return"#1677ff";if(m<=60)return"#e5a41a";return"#d64545"}
function getAqiClass(a){if(a==null)return"";if(a<=50)return"aqi-good";if(a<=100)return"aqi-moderate";if(a<=150)return"aqi-unhealthy";if(a<=200)return"aqi-bad";return"aqi-severe"}

function openBaidu(appUrl,webUrl){let hidden=false;const listener=()=>{if(document.hidden)hidden=true};document.addEventListener("visibilitychange",listener,{once:true});window.location.href=appUrl;setTimeout(()=>{if(!hidden)window.location.href=webUrl},1500)}
